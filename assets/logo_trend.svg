<svg width="1200" height="380" viewBox="0 0 1200 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.8" fill="#21262d"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="#0d1117"/>
  <rect width="1200" height="380" fill="url(#dots)"/>

  <!-- Left orange accent strip -->
  <rect x="0" y="0" width="4" height="380" fill="#ff7a1a"/>

  <!-- Subtle orange glow behind title -->
  <rect x="44" y="94" width="440" height="76" rx="6" fill="#ff7a1a" opacity="0.04"/>

  <!-- TrendScope title -->
  <text x="52" y="162"
    font-family="'Courier New', Courier, monospace"
    font-size="66"
    font-weight="700"
    fill="#e6edf3">TrendScope</text>

  <!-- Orange underline accent -->
  <rect x="52" y="172" width="420" height="3" rx="1" fill="#ff7a1a"/>

  <!-- Subtitle -->
  <text x="52" y="208"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    fill="#8b949e">Real-time GitHub Trending Dashboard</text>

  <!-- Tech tags / pills -->
  <rect x="52"  y="234" width="74"  height="24" rx="12" fill="#161b22" stroke="#ff7a1a"  stroke-width="1"/>
  <text x="89"  y="250" font-family="Arial, sans-serif" font-size="11" fill="#ff7a1a"  text-anchor="middle">Streamlit</text>

  <rect x="135" y="234" width="64"  height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="167" y="250" font-family="Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Plotly</text>

  <rect x="208" y="234" width="54"  height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="235" y="250" font-family="Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">bs4</text>

  <rect x="271" y="234" width="60"  height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="301" y="250" font-family="Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">ngrok</text>

  <rect x="340" y="234" width="64"  height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <text x="372" y="250" font-family="Arial, sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Python</text>

  <!-- Description line -->
  <text x="52" y="290"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    fill="#3d444d">No API key · live data · dark-orange theme</text>

  <!-- Creator credit -->
  <text x="52" y="334"
    font-family="'Courier New', Courier, monospace"
    font-size="13"
    fill="#484f58">created by </text>
  <text x="148" y="334"
    font-family="'Courier New', Courier, monospace"
    font-size="13"
    font-weight="700"
    fill="#ff7a1a">GTRe5</text>

  <!-- ═══ RIGHT: Terminal window ═══ -->

  <!-- Window frame -->
  <rect x="648" y="44" width="520" height="300" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar (rounded top, flat bottom) -->
  <rect x="648" y="44" width="520" height="38" rx="10" fill="#1c2128"/>
  <rect x="648" y="68" width="520" height="14" fill="#1c2128"/>
  <line x1="648" y1="82" x2="1168" y2="82" stroke="#30363d" stroke-width="1"/>

  <!-- Traffic light dots -->
  <circle cx="678" cy="63" r="6" fill="#ff5f56"/>
  <circle cx="700" cy="63" r="6" fill="#ffbd2e"/>
  <circle cx="722" cy="63" r="6" fill="#ff7a1a"/>

  <!-- Title bar label -->
  <text x="908" y="68"
    font-family="'Courier New', Courier, monospace"
    font-size="11"
    fill="#8b949e"
    text-anchor="middle">$ github-trending --since=daily</text>

  <!-- LIVE badge -->
  <rect x="1118" y="52" width="40" height="20" rx="4" fill="#0d2318"/>
  <circle cx="1129" cy="62" r="3" fill="#3fb950"/>
  <text x="1148" y="66"
    font-family="Arial, sans-serif"
    font-size="9"
    fill="#3fb950"
    text-anchor="middle">LIVE</text>

  <!-- Chart section label -->
  <text x="664" y="104"
    font-family="Arial, Helvetica, sans-serif"
    font-size="11"
    fill="#3d444d">top repositories by stars gained today</text>

  <!-- Horizontal bar chart rows -->
  <!-- Row 1 -->
  <text x="798" y="128" font-family="'Courier New', Courier, monospace" font-size="10" fill="#8b949e" text-anchor="end">openai/gpt</text>
  <rect x="804" y="116" width="295" height="16" rx="3" fill="#ff7a1a"/>
  <text x="1106" y="128" font-family="'Courier New', Courier, monospace" font-size="10" fill="#ff7a1a">+4,210 ★</text>

  <!-- Row 2 -->
  <text x="798" y="154" font-family="'Courier New', Courier, monospace" font-size="10" fill="#8b949e" text-anchor="end">microsoft/phi</text>
  <rect x="804" y="142" width="240" height="16" rx="3" fill="#c2410c"/>
  <text x="1050" y="154" font-family="'Courier New', Courier, monospace" font-size="10" fill="#c2410c">+3,450 ★</text>

  <!-- Row 3 -->
  <text x="798" y="180" font-family="'Courier New', Courier, monospace" font-size="10" fill="#8b949e" text-anchor="end">vercel/next</text>
  <rect x="804" y="168" width="190" height="16" rx="3" fill="#ff7a1a" opacity="0.65"/>
  <text x="1000" y="180" font-family="'Courier New', Courier, monospace" font-size="10" fill="#ff7a1a" opacity="0.65">+2,700 ★</text>

  <!-- Row 4 -->
  <text x="798" y="206" font-family="'Courier New', Courier, monospace" font-size="10" fill="#8b949e" text-anchor="end">meta/llama</text>
  <rect x="804" y="194" width="148" height="16" rx="3" fill="#c2410c" opacity="0.65"/>
  <text x="958" y="206" font-family="'Courier New', Courier, monospace" font-size="10" fill="#c2410c" opacity="0.65">+2,080 ★</text>

  <!-- Row 5 -->
  <text x="798" y="232" font-family="'Courier New', Courier, monospace" font-size="10" fill="#8b949e" text-anchor="end">huggingface/tr</text>
  <rect x="804" y="220" width="106" height="16" rx="3" fill="#ff7a1a" opacity="0.45"/>
  <text x="916" y="232" font-family="'Courier New', Courier, monospace" font-size="10" fill="#ff7a1a" opacity="0.45">+1,490 ★</text>

  <!-- Row 6 -->
  <text x="798" y="258" font-family="'Courier New', Courier, monospace" font-size="10" fill="#8b949e" text-anchor="end">pytorch/torch</text>
  <rect x="804" y="246" width="74" height="16" rx="3" fill="#c2410c" opacity="0.45"/>
  <text x="884" y="258" font-family="'Courier New', Courier, monospace" font-size="10" fill="#c2410c" opacity="0.45">+1,040 ★</text>

  <!-- Axis -->
  <line x1="804" y1="272" x2="1148" y2="272" stroke="#30363d" stroke-width="0.5"/>
  <text x="976" y="290"
    font-family="Arial, sans-serif"
    font-size="11"
    fill="#3d444d"
    text-anchor="middle">stars gained (daily)</text>

  <!-- Bottom KPI strip inside terminal -->
  <rect x="648" y="308" width="520" height="36" fill="#1c2128"/>
  <line x1="648" y1="308" x2="1168" y2="308" stroke="#30363d" stroke-width="0.5"/>

  <!-- Bottom rounded corner fix (rendered BEFORE text so text appears on top) -->
  <rect x="648" y="334" width="520" height="10" rx="0" fill="#1c2128"/>
  <rect x="648" y="332" width="520" height="12" rx="10" fill="#1c2128"/>

  <!-- KPI: repos — section 648→778, center 713 -->
  <text x="713" y="322" font-family="Arial, sans-serif" font-size="9" fill="#484f58" text-anchor="middle">REPOS</text>
  <text x="713" y="336" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#e6edf3" text-anchor="middle">25</text>

  <!-- Divider -->
  <line x1="778" y1="314" x2="778" y2="338" stroke="#30363d" stroke-width="0.5"/>

  <!-- KPI: total stars — section 778→908, center 843 -->
  <text x="843" y="322" font-family="Arial, sans-serif" font-size="9" fill="#484f58" text-anchor="middle">TOTAL STARS</text>
  <text x="843" y="336" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#e6edf3" text-anchor="middle">1,248,400</text>

  <!-- Divider -->
  <line x1="908" y1="314" x2="908" y2="338" stroke="#30363d" stroke-width="0.5"/>

  <!-- KPI: stars gained — section 908→1038, center 973 -->
  <text x="973" y="322" font-family="Arial, sans-serif" font-size="9" fill="#484f58" text-anchor="middle">STARS GAINED</text>
  <text x="973" y="336" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#ff7a1a" text-anchor="middle">+15,970</text>

  <!-- Divider -->
  <line x1="1038" y1="314" x2="1038" y2="338" stroke="#30363d" stroke-width="0.5"/>

  <!-- KPI: top lang — section 1038→1168, center 1103 -->
  <text x="1103" y="322" font-family="Arial, sans-serif" font-size="9" fill="#484f58" text-anchor="middle">TOP LANG</text>
  <text x="1103" y="336" font-family="'Courier New', Courier, monospace" font-size="11" font-weight="700" fill="#e6edf3" text-anchor="middle">TypeScript</text>

</svg>
